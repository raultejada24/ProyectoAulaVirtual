{{>header}}
    <br>
    <div>
        <h1 class="Alternative_text bi bi-exclamation-triangle-fill display-6 text-danger">
            <strong>
             Se ha producido un error
            </strong>
            </h1>
        <h2 class = "text-danger text-center mt-4">  {{errorMessage}} </h2>
        <!--Si se hace así, podremos aprovechar este html para muchos tipos de error diferentes.-->
        <ul class = "text-danger text-center mt-4"></ul>
        {{#errorsArray}}
            <li class="text-danger text-center mt-4">{{.}}</li>
        </ul>
        {{/errorsArray}}

    </div>
    <br>
    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary px-4 py-2"><i class="bi bi-house-door"></i> Volver a la página principal</a>
    </div>
    <br>
    {{>footer}}
</body>
</html>
