<!-- Modal Genérico -->
<div class="modal fade" id="genericModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel"><strong>Título del Modal</strong></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Contenido dinámico -->
          <div id="modalContent"></div>
        </div>
        <div class="modal-footer">
          <button type="button" id="modalActionBtn" class="btn btn-primary" data-bs-dismiss="modal">Volver</button>
        </div>
      </div>
    </div>
</div>
